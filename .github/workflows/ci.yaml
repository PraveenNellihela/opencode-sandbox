name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Stage 1: Static analysis (fast, no Docker needed)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          additional_files: 'opencode'

      - name: Hadolint Dockerfile linting
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Validate script syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n opencode
          bash -n scripts/configure-opencode.sh

      - name: Validate JSON templates
        run: jq empty preconfig/opencode.json

      - name: Validate agent frontmatter
        run: |
          for f in preconfig/agents/*.md; do
            head -1 "$f" | grep -q '^---$' || { echo "FAIL: $f missing opening ---"; exit 1; }
            sed -n '2,/^---$/{ /^---$/d; p; }' "$f" | grep -q 'description:'
            sed -n '2,/^---$/{ /^---$/d; p; }' "$f" | grep -q 'mode:'
            sed -n '2,/^---$/{ /^---$/d; p; }' "$f" | grep -q 'temperature:'
            sed -n '2,/^---$/{ /^---$/d; p; }' "$f" | grep -q 'permission:'
            echo "OK: $f"
          done

  # Stage 2: Unit tests with bats
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: sudo npm install -g bats

      - name: Run unit tests
        run: bats test/test_configure.bats test/test_wrapper.bats test/test_install_flags.bats

  # Stage 3: Docker build matrix
  docker-build:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "minimal"
            args: ""
          - name: "cli-tools"
            args: "--build-arg INSTALL_CLI_TOOLS=true"
          - name: "node"
            args: "--build-arg INSTALL_NODE=true"
          - name: "python"
            args: "--build-arg INSTALL_PYTHON=true"
          - name: "impeccable"
            args: "--build-arg INSTALL_NODE=true --build-arg OPCODE_PLUGINS=impeccable"
          - name: "emil"
            args: "--build-arg OPCODE_PLUGINS=emil"
          - name: "recommended"
            args: >-
              --build-arg INSTALL_NODE=true
              --build-arg INSTALL_PYTHON=true
              --build-arg INSTALL_CLI_TOOLS=true
              --build-arg OPCODE_PLUGINS="superpowers,pty,notify,websearch,impeccable,emil"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (${{ matrix.name }})
        run: |
          docker build ${{ matrix.args }} -t test-${{ matrix.name }}:latest .

      - name: Verify non-root user
        run: |
          USER=$(docker run --rm --entrypoint /bin/sh test-${{ matrix.name }}:latest -c "whoami")
          [ "$USER" = "dev" ]

      - name: Verify opencode binary runs
        run: |
          docker run --rm test-${{ matrix.name }}:latest --version

      - name: Verify config seeder and templates present
        run: |
          docker run --rm --entrypoint /bin/sh test-${{ matrix.name }}:latest -c \
            "test -f /opt/opencode-sandbox/configure-opencode.sh && test -f /opt/opencode-sandbox/preconfig/opencode.json && test -f /opt/opencode-sandbox/VERSION && test -x /usr/local/bin/mise"

      - name: Verify impeccable skill seeded
        if: matrix.name == 'impeccable' || matrix.name == 'recommended'
        run: |
          docker run --rm --entrypoint /bin/sh test-${{ matrix.name }}:latest \
            -c "test -f /home/dev/.config/opencode/skills/impeccable/SKILL.md && test -f /home/dev/.config/opencode/skills/impeccable/LICENSE && test -f /home/dev/.config/opencode/skills/impeccable/NOTICE.md"

      - name: Verify emil skills seeded
        if: matrix.name == 'emil' || matrix.name == 'recommended'
        run: |
          docker run --rm --entrypoint /bin/sh test-${{ matrix.name }}:latest \
            -c "test -f /home/dev/.config/opencode/skills/emil-design-eng/SKILL.md && test -f /home/dev/.config/opencode/skills/LICENSE-emil-skills"

  # Stage 4: Publish prebuilt multi-arch images to GHCR (on main only)
  publish:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push minimal
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "SANDBOX_VERSION=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -t ghcr.io/${{ lower(github.repository) }}:minimal \
            --push .

      - name: Build and push recommended
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "INSTALL_NODE=true" \
            --build-arg "INSTALL_PYTHON=true" \
            --build-arg "INSTALL_CLI_TOOLS=true" \
            --build-arg "OPCODE_PLUGINS=superpowers,pty,notify,websearch,impeccable,emil" \
            --build-arg "SANDBOX_VERSION=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -t ghcr.io/${{ lower(github.repository) }}:recommended \
            -t ghcr.io/${{ lower(github.repository) }}:latest \
            --push .

  # Stage 5: End-to-end tests
  e2e:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: sudo npm install -g bats

      - name: Run E2E tests
        run: bats test/test_e2e.bats
